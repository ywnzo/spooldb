name: Release installers
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun scripts/verify-release-version.js
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run build:installer
      - name: Install Podman when needed
        if: matrix.engine == 'podman'
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)
      - name: Verify real containers and persistent memory
        run: sudo env SPOOL_TEST_CONTAINER_ENGINE=/usr/bin/${{ matrix.engine }} "$(command -v bun)" test --timeout 600000 test/server-container-runtime.test.js
  apple-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: test "$(uname -m)" = arm64
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 30000 test/adapters.test.js test/plugin-bootstrap.test.js test/production-dependencies.test.js test/submodules.test.js test/update.test.js
      - run: bun run build:plugin
      - run: bun scripts/verify-plugin-bundle.js
  release:
    needs: [version, apple-silicon, containers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run test
      - run: bun run typecheck
      - name: Verify multilingual retrieval quality
        run: bun run benchmark:quality --check
        env:
          SPOOL_MODEL_CACHE: ${{ runner.temp }}/spool-models
      - run: bun scripts/build-codex-plugin.js
      - run: bun scripts/build-codex-marketplace.js
      - run: bun scripts/build-linux-installer.js
      - name: Prepare downloads
        run: |
          cp scripts/install.sh installers/install.sh
          cd installers
          sha256sum spool-linux-x64.run spooldb-codex.tar.gz install.sh > SHA256SUMS
      - name: Stage verified downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spool-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            installers/spool-linux-x64.run
            installers/spooldb-codex.tar.gz
            installers/install.sh
            installers/SHA256SUMS
            work/codex-marketplace
            docs/releases/*.md
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spool-release
      - name: Verify artifact checksums
        run: cd installers && sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            installers/spool-linux-x64.run \
            installers/spooldb-codex.tar.gz \
            installers/install.sh installers/SHA256SUMS \
            --verify-tag "${notes[@]}" --title "SpoolDB $GITHUB_REF_NAME"
          cd work/codex-marketplace
          rm -rf .git
          git init -b codex-marketplace
          git config core.hooksPath /dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config credential.helper '!gh auth git-credential'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads origin codex-marketplace >/dev/null 2>&1; then
            git fetch --depth=1 origin codex-marketplace
            git reset --soft FETCH_HEAD
          fi
          git add -A
          git commit -m "Publish Codex marketplace $GITHUB_REF_NAME"
          git push origin HEAD:codex-marketplace
