name: Release installers
on:
  push:
    tags: ['v*']
    branches: ['codex/rust-release-review']
concurrency:
  group: spool-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun scripts/verify-release-version.js
        env:
          SPOOL_RELEASE_REVIEW: ${{ github.ref_type == 'branch' }}
  containers:
    needs: [rust-hooks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spool-hook-linux-x64
          path: hook-artifacts/linux
      - run: bun run build:installer
        env:
          SPOOL_CLIENT_LINUX_X64: hook-artifacts/linux/spool-native
          SPOOL_RELAY_LINUX_X64: hook-artifacts/linux/spool-native
      - name: Install Podman when needed
        if: matrix.engine == 'podman'
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)
      - name: Verify the Rust relay and Caddy with legacy data
        run: sudo env SPOOL_TEST_CONTAINER_ENGINE=/usr/bin/${{ matrix.engine }} "$(command -v bun)" rust/tests/container-relay-fixture.js work/linux-package/SpoolDB/runtime/spool-relay-linux-x64
      - name: Verify real containers and persistent memory
        run: sudo env SPOOL_TEST_CONTAINER_ENGINE=/usr/bin/${{ matrix.engine }} "$(command -v bun)" test --timeout 600000 test/server-container-runtime.test.js
      - name: Download and verify the released v0.4.45 installer
        run: |
          mkdir -p work/legacy-relay
          cd work/legacy-relay
          base=https://github.com/ywnzo/spooldb/releases/download/v0.4.45
          curl --fail --silent --show-error --location --retry 3 "$base/SHA256SUMS" -o SHA256SUMS
          curl --fail --silent --show-error --location --retry 3 "$base/spool-linux-x64.run" -o spool-linux-x64.run
          sha256sum --check --ignore-missing SHA256SUMS
          payload=$(awk '/^__SPOOL_PAYLOAD__$/{print NR+1;exit}' spool-linux-x64.run)
          test -n "$payload"
          tail -n +"$payload" spool-linux-x64.run | tar -xz
      - name: Verify the packaged Rust updater and rollback from v0.4.45
        run: sudo env GITHUB_ACTIONS=true SPOOL_TEST_CONTAINER_ENGINE=/usr/bin/${{ matrix.engine }} "$(command -v bun)" rust/tests/packaged-relay-upgrade.js work/legacy-relay/SpoolDB installers/spool-linux-x64.run
  apple-silicon:
    needs: [rust-hooks]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: test "$(uname -m)" = arm64
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 30000 test/adapters.test.js test/plugin-bootstrap.test.js test/production-dependencies.test.js test/submodules.test.js test/update.test.js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spool-hook-*
          path: hook-artifacts
      - run: bun run build:plugin
        env:
          SPOOL_HOOK_LINUX_X64: hook-artifacts/spool-hook-linux-x64/spool-hook
          SPOOL_HOOK_DARWIN_ARM64: hook-artifacts/spool-hook-darwin-arm64/spool-hook
          SPOOL_CLIENT_LINUX_X64: hook-artifacts/spool-hook-linux-x64/spool-native
          SPOOL_CLIENT_DARWIN_ARM64: hook-artifacts/spool-hook-darwin-arm64/spool-native
      - run: bun scripts/verify-plugin-bundle.js
  rust-hooks:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: rustup toolchain install 1.96.0 --profile minimal
      - if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - run: bun install --frozen-lockfile
      - run: cargo +1.96.0 build --locked --release --manifest-path rust/Cargo.toml --bin spool-hook --bin spool-native
      - run: SPOOL_TEST_RUST_HOOK="$PWD/rust/target/release/spool-hook" bun test --test-name-pattern 'standalone Rust hooks' test/stable-hooks.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spool-hook-${{ matrix.target }}
          path: |
            rust/target/release/spool-hook
            rust/target/release/spool-native
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [version, apple-silicon, containers, rust-hooks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run test
      - run: bun run typecheck
      - name: Verify multilingual retrieval quality
        run: bun run benchmark:quality --check
        env:
          SPOOL_MODEL_CACHE: ${{ runner.temp }}/spool-models
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spool-hook-*
          path: hook-artifacts
      - run: bun scripts/build-codex-plugin.js
        env:
          SPOOL_HOOK_LINUX_X64: hook-artifacts/spool-hook-linux-x64/spool-hook
          SPOOL_HOOK_DARWIN_ARM64: hook-artifacts/spool-hook-darwin-arm64/spool-hook
          SPOOL_CLIENT_LINUX_X64: hook-artifacts/spool-hook-linux-x64/spool-native
          SPOOL_CLIENT_DARWIN_ARM64: hook-artifacts/spool-hook-darwin-arm64/spool-native
      - run: bun scripts/verify-plugin-bundle.js
      - run: bun scripts/build-codex-marketplace.js
      - run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.96.0 install worker-build --version '=0.9.0' --locked
      - run: bun scripts/build-rust-worker.js
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
      - run: bun rust/tests/cloudflare-fixture.js rust/cloudflare/build/index.js
      - run: bun test --timeout 60000 test/remote-mcp.test.js
        env:
          SPOOL_RUST_WORKER_CONFIG: rust/cloudflare/wrangler.jsonc
      - run: bun scripts/build-linux-installer.js
        env:
          SPOOL_CLIENT_LINUX_X64: hook-artifacts/spool-hook-linux-x64/spool-native
          SPOOL_RELAY_LINUX_X64: hook-artifacts/spool-hook-linux-x64/spool-native
          SPOOL_NATIVE_PLUGIN_SOURCE: work/plugin-marketplace
      - run: installers/spool-linux-x64.run --verify-only
      - name: Prepare downloads
        run: |
          cp scripts/install.sh installers/install.sh
          cd installers
          sha256sum spool-linux-x64.run spooldb-codex.tar.gz install.sh > SHA256SUMS
      - name: Stage verified downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spool-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            installers/spool-linux-x64.run
            installers/spooldb-codex.tar.gz
            installers/install.sh
            installers/SHA256SUMS
            work/codex-marketplace
            docs/releases/*.md
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spool-release
      - name: Verify artifact checksums
        run: cd installers && sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            installers/spool-linux-x64.run \
            installers/spooldb-codex.tar.gz \
            installers/install.sh installers/SHA256SUMS \
            --verify-tag "${notes[@]}" --title "SpoolDB $GITHUB_REF_NAME"
          cd work/codex-marketplace
          rm -rf .git
          git init -b codex-marketplace
          git config core.hooksPath /dev/null
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config credential.helper '!gh auth git-credential'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads origin codex-marketplace >/dev/null 2>&1; then
            git fetch --depth=1 origin codex-marketplace
            git reset --soft FETCH_HEAD
          fi
          git add -A
          git commit -m "Publish Codex marketplace $GITHUB_REF_NAME"
          git push origin HEAD:codex-marketplace
