name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
  apple-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: test "$(uname -m)" = arm64
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 30000 test/adapters.test.js test/plugin-bootstrap.test.js test/production-dependencies.test.js
      - run: bun run build:plugin
      - run: bun scripts/verify-plugin-bundle.js
